# 2026-10-28 观测修补（排查“模型几乎从不按英雄技能”时查出的观测漏项），叠加在 m4.yaml / arch_v2.yaml 之上，不用重训 BC：
#   show_effects：狂暴法术（瓶子和区域以前都看不见）、英雄技能区域、冰人死亡减速区、地震的隐藏伤害等画进法术层和单位列表；
#   king_shots：国王塔开过火就算已激活；
#   obs_ext：技能状态（就绪、发动过、距上次发动）、进化充能（手牌和对手见过的牌）、单位状态（减速/冻结/狂暴/中毒/隐身……）。
# obs_ext 的新输入层从 0 开始：旧存档照常加载、加载后输出不变（续训时优化器状态也原样接上，见 train/ppo.py: extend_adam）。
# show_effects / king_shots 会改变已有输入（以前是空的地方现在有东西），模型要在续训里适应；BC 数据是旧观测转的，BC 参考网络在这些局面下会略有偏差。
obs:
  show_effects: true
  king_shots: true
model:
  obs_ext: true
